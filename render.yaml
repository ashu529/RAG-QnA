services:
  # ── BACKEND: Python / Flask ──────────────────────────────────────────────
  - type: web
    name: rag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set this manually in the Render dashboard
      - key: FRONTEND_URL
        sync: false          # Set to your Render frontend URL after first deploy
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: rag-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # ── FRONTEND: Vite / React static site ──────────────────────────────────
  - type: web
    name: rag-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your Render backend URL, e.g. https://rag-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
